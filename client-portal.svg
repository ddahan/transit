<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 927 316">
  <title>Client Portal</title>
  <defs>
    <linearGradient id="cp-ring" x1="-50" y1="-50" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="cp-deep" r="0.5">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="cp-glow" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .cp-eyebrow { stroke: #8b5cf6; }
    .cp-ink { stroke: #1e1b4b; }
    .cp-ring, .cp-glow { transform-origin: 0 0; }
    .cp-ring { animation: gate-spin 4s linear infinite; }
    .cp-glow { animation: gate-core 3s ease-in-out infinite alternate; }
    @media (prefers-color-scheme: dark) {
      .cp-eyebrow { stroke: #a78bfa; }
      .cp-ink { stroke: #f5f3ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cp-ring, .cp-glow { animation: none; }
    }
  </style>
  <svg x="8" y="8" width="289" height="300" viewBox="20 10 472 490">
  <defs>
    <linearGradient id="gate-block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a6fd"/><stop offset="0.17" stop-color="#b9a6fd"/>
      <stop offset="0.17" stop-color="#8b5cf6"/><stop offset="0.8" stop-color="#8b5cf6"/>
      <stop offset="0.8" stop-color="#7340e8"/><stop offset="1" stop-color="#7340e8"/>
    </linearGradient>
    <linearGradient id="gate-shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a6fd"/><stop offset="0.16" stop-color="#b9a6fd"/>
      <stop offset="0.16" stop-color="#8b5cf6"/><stop offset="0.84" stop-color="#8b5cf6"/>
      <stop offset="0.84" stop-color="#7340e8"/><stop offset="1" stop-color="#7340e8"/>
    </linearGradient>
    <radialGradient id="gate-arch" cx="256" cy="210" r="186" gradientUnits="userSpaceOnUse">
      <stop offset="0.570" stop-color="#7340e8"/><stop offset="0.640" stop-color="#7340e8"/>
      <stop offset="0.640" stop-color="#8b5cf6"/><stop offset="0.930" stop-color="#8b5cf6"/>
      <stop offset="0.930" stop-color="#b9a6fd"/><stop offset="1" stop-color="#b9a6fd"/>
    </radialGradient>
    <radialGradient id="gate-deep" cx="256" cy="282" r="205" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.7" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="gate-front" cx="0" cy="0" r="209" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#cffafe"/>
      <stop offset="0.6" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </radialGradient>
    <radialGradient id="gate-core" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="gate-opening"><path d="M150 210A106 106 0 0 1 362 210V441H150Z"/></clipPath>
  </defs>
  <style>
    .gate-spin, .gate-slow, .gate-core, .gate-twinkle { transform-origin: 0 0; }
    .gate-spin { animation: gate-spin 6s linear infinite; }
    .gate-slow { animation: gate-spin 11s linear infinite; }
    .gate-core { animation: gate-core 3s ease-in-out infinite alternate; }
    .gate-twinkle { animation: gate-twinkle 2.6s ease-in-out infinite; }
    @keyframes gate-spin { to { transform: rotate(360deg); } }
    @keyframes gate-core { from { transform: scale(0.75); opacity: 0.6; } to { transform: scale(1.2); opacity: 1; } }
    @keyframes gate-twinkle {
      0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.7; }
      50% { transform: scale(1) rotate(45deg); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gate-spin, .gate-slow, .gate-core, .gate-twinkle { animation: none; }
    }
  </style>

  <!-- Portal: two round vortices filling the opening, the inner one faster, both turning the
       way their arms open (pouring in). -->
  <path d="M150 210A106 106 0 0 1 362 210V441H150Z" fill="url(#gate-deep)"/>
  <g clip-path="url(#gate-opening)">
