    <g transform="translate(206 382)"><g class="gate-twinkle" style="animation-delay:-1.3s"><circle r="7"/></g></g>
    <g transform="translate(298 372)"><g class="gate-twinkle" style="animation-delay:-1.9s"><path d="M0 -18Q2.88 -2.88 18 0Q2.88 2.88 0 18Q-2.88 2.88 -18 0Q-2.88 -2.88 0 -18Z" transform="translate(0 0)"/></g></g>
