  <!-- Stones: a round-joined outline drawn under all of them (it also fills the joints), then
       the stones with flat bevels; the keystone sits on the arch with its own outline. -->
  <g fill="#1e1b4b" stroke="#1e1b4b" stroke-width="10" stroke-linejoin="round">
    <path d="M70 210A186 186 0 0 1 442 210H362A106 106 0 0 0 150 210Z"/><rect x="70" y="266" width="80" height="119" rx="8"/><rect x="362" y="266" width="80" height="119" rx="8"/><rect x="52" y="215" width="116" height="46" rx="10"/><rect x="52" y="390" width="116" height="46" rx="10"/><rect x="344" y="215" width="116" height="46" rx="10"/><rect x="344" y="390" width="116" height="46" rx="10"/><rect x="28" y="441" width="456" height="48" rx="10"/>
  </g>
  <g fill="url(#gate-arch)"><path d="M70 210A186 186 0 0 1 442 210H362A106 106 0 0 0 150 210Z"/></g>
  <g fill="url(#gate-shaft)"><rect x="70" y="266" width="80" height="119" rx="8"/><rect x="362" y="266" width="80" height="119" rx="8"/></g>
  <g fill="url(#gate-block)"><rect x="52" y="215" width="116" height="46" rx="10"/><rect x="52" y="390" width="116" height="46" rx="10"/><rect x="344" y="215" width="116" height="46" rx="10"/><rect x="344" y="390" width="116" height="46" rx="10"/><rect x="28" y="441" width="456" height="48" rx="10"/></g>
