    <clipPath id="cp-o"><circle r="63.0"/></clipPath>
  </defs>
  <style>
    .gate-spin, .gate-slow, .gate-core, .gate-twinkle { transform-origin: 0 0; }
    .gate-spin { animation: gate-spin 6s linear infinite; }
    .gate-slow { animation: gate-spin 11s linear infinite; }
    .gate-core { animation: gate-core 3s ease-in-out infinite alternate; }
    .gate-twinkle { animation: gate-twinkle 2.6s ease-in-out infinite; }
    @keyframes gate-spin { to { transform: rotate(360deg); } }
    @keyframes gate-core { from { transform: scale(0.75); opacity: 0.6; } to { transform: scale(1.2); opacity: 1; } }
    @keyframes gate-twinkle {
      0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.7; }
      50% { transform: scale(1) rotate(45deg); opacity: 1; }
    }
    @media (prefers-color-scheme: dark) {
    }
    @media (prefers-reduced-motion: reduce) {
      .gate-spin, .gate-slow, .gate-core, .gate-twinkle { animation: none; }
    }
  </style>
