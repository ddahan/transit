  <title>Portal</title>
  <defs>
    <radialGradient id="gate-core" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cp-deep" r="0.5">
      <stop offset="0" stop-color="#4f39f6"/>
      <stop offset="0.7" stop-color="#372aac"/>
      <stop offset="1" stop-color="#1e1a4d"/>
    </radialGradient>
    <radialGradient id="cp-front" cx="0" cy="0" r="209" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#cefafe"/>
      <stop offset="0.6" stop-color="#00d3f3"/>
      <stop offset="1" stop-color="#0092b8"/>
