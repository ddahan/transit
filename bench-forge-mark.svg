<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 141 141">
  <title>Bench Forge</title>
  <defs>
    <radialGradient id="bf-void" cx="0" cy="34" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a3412"/>
      <stop offset="0.3" stop-color="#431407"/>
      <stop offset="0.65" stop-color="#1a0b06"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </radialGradient>
    <radialGradient id="bf-heat" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bf-flame" x1="0" y1="27" x2="0" y2="-53" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.16" stop-color="#fef3c7"/>
      <stop offset="0.38" stop-color="#fbbf24"/>
      <stop offset="0.62" stop-color="#f97316"/>
      <stop offset="0.85" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="bf-iron" x1="0" y1="27" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#78716c"/>
      <stop offset="0.12" stop-color="#3a3532"/>
      <stop offset="0.5" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="bf-ring" x1="-66" y1="40" x2="66" y2="-40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3532"/>
      <stop offset="0.3" stop-color="#57534e"/>
      <stop offset="0.55" stop-color="#9a3412"/>
      <stop offset="0.78" stop-color="#f97316"/>
      <stop offset="0.92" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="bf-fire" x1="0" y1="27" x2="0" y2="-64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.45" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#7f1d1d" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="bf-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="bf-soft" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="bf-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <clipPath id="bf-o"><circle r="63.0"/></clipPath>
  </defs>
  <style>
    .bf-bar { transform-box: fill-box; transform-origin: 50% 100%; }
    .bf-b0 { animation: bf-flicker 1.7s ease-in-out -0.3s infinite; }
    .bf-b1 { animation: bf-flicker 2.1s ease-in-out -1.1s infinite; }
    .bf-b2 { animation: bf-flicker 1.5s ease-in-out -0.7s infinite; }
    .bf-b3 { animation: bf-flicker 1.9s ease-in-out -1.6s infinite; }
    .bf-b4 { animation: bf-flicker 1.6s ease-in-out -0.2s infinite; }
    @keyframes bf-flicker {
      0%, 100% { transform: scaleY(1); }
      20% { transform: scaleY(0.9); }
      45% { transform: scaleY(1.05); }
      70% { transform: scaleY(0.94); }
      85% { transform: scaleY(1.02); }
    }
    .bf-flame { transform-box: fill-box; transform-origin: 50% 100%; }
    .bf-f1 { animation: bf-lick 2.3s ease-in-out infinite; }
    .bf-f2 { animation: bf-lick 1.7s ease-in-out -0.8s infinite reverse; }
    @keyframes bf-lick {
      0%, 100% { transform: skewX(0deg) scaleY(1); }
      25% { transform: skewX(-4deg) scaleY(1.06); }
      50% { transform: skewX(2deg) scaleY(0.94); }
      75% { transform: skewX(4deg) scaleY(1.04); }
    }
    .bf-spark { transform-box: fill-box; transform-origin: 50% 50%; }
    .bf-s0 { animation: bf-s0 2.2s cubic-bezier(.2,.6,.4,1) 0.0s infinite; }
    @keyframes bf-s0 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(-16px, -70px) scale(0.3); opacity: 0; } }
    .bf-s1 { animation: bf-s1 2.6s cubic-bezier(.2,.6,.4,1) -0.9s infinite; }
    @keyframes bf-s1 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(-6px, -92px) scale(0.3); opacity: 0; } }
    .bf-s2 { animation: bf-s2 1.9s cubic-bezier(.2,.6,.4,1) -1.4s infinite; }
    @keyframes bf-s2 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(9px, -84px) scale(0.3); opacity: 0; } }
    .bf-s3 { animation: bf-s3 2.4s cubic-bezier(.2,.6,.4,1) -0.5s infinite; }
    @keyframes bf-s3 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(22px, -66px) scale(0.3); opacity: 0; } }
    .bf-s4 { animation: bf-s4 2.0s cubic-bezier(.2,.6,.4,1) -1.8s infinite; }
    @keyframes bf-s4 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(30px, -58px) scale(0.3); opacity: 0; } }
    .bf-s5 { animation: bf-s5 1.8s cubic-bezier(.2,.6,.4,1) -1.1s infinite; }
    @keyframes bf-s5 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(-30px, -52px) scale(0.3); opacity: 0; } }
    .bf-s6 { animation: bf-s6 2.8s cubic-bezier(.2,.6,.4,1) -2.0s infinite; }
    @keyframes bf-s6 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(-4px, -98px) scale(0.3); opacity: 0; } }
    .bf-s7 { animation: bf-s7 2.3s cubic-bezier(.2,.6,.4,1) -0.3s infinite; }
    @keyframes bf-s7 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(14px, -76px) scale(0.3); opacity: 0; } }
    .bf-s8 { animation: bf-s8 2.5s cubic-bezier(.2,.6,.4,1) -1.6s infinite; }
    @keyframes bf-s8 { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(12px, -88px) scale(0.3); opacity: 0; } }
    .bf-heat { transform-origin: 0 27px; animation: bf-heat 2.4s ease-in-out infinite alternate; }
    @keyframes bf-heat { from { opacity: 0.65; transform: scale(0.92); } to { opacity: 1; transform: scale(1.08); } }
    .bf-hot { animation: bf-hot 1.2s ease-in-out infinite alternate; }
    @keyframes bf-hot { from { opacity: 0.55; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .bf-bar, .bf-flame, .bf-spark, .bf-heat, .bf-hot { animation: none; }
      .bf-spark { opacity: 0; }
    }
  </style>
  <g transform="translate(70.5 70.5)"><g clip-path="url(#bf-o)">
        <circle r="63.0" fill="url(#bf-void)"/>
        <ellipse class="bf-heat" cx="4" cy="21" rx="58" ry="40" fill="url(#bf-heat)"/>
        <path class="bf-flame bf-f1" d="M-38 27C-46 8 -36 -8 -30 -22C-27 -10 -22 -4 -18 -6C-21 -26 -10 -44 3 -64C7 -44 20 -36 18 -16C23 -20 27 -28 29 -38C40 -20 50 2 46 27Z" fill="url(#bf-fire)" filter="url(#bf-edge)"/>
        <path class="bf-flame bf-f2" d="M-24 27C-30 12 -22 0 -16 -10C-13 -2 -9 0 -6 -2C-8 -18 0 -32 6 -44C10 -30 18 -22 16 -6C20 -10 24 -16 25 -22C32 -8 36 10 32 27Z" fill="#fb923c" opacity="0.85" filter="url(#bf-edge)"/>
        <g fill="#f97316" opacity="0.8" filter="url(#bf-blur)"><path class="bf-bar bf-b0" d="M-29 30L-29 -2.0A5.0 5.0 0 0 1 -19 -2.0L-19 30Z"/><path class="bf-bar bf-b1" d="M-15 30L-15 -24.0A5.0 5.0 0 0 1 -5 -24.0L-5 30Z"/><path class="bf-bar bf-b2" d="M-1 30L-1 -46.0A5.0 5.0 0 0 1 9 -46.0L9 30Z"/><path class="bf-bar bf-b3" d="M13 30L13 -28.0A5.0 5.0 0 0 1 23 -28.0L23 30Z"/><path class="bf-bar bf-b4" d="M27 30L27 -10.0A5.0 5.0 0 0 1 37 -10.0L37 30Z"/></g>
        <g fill="url(#bf-flame)"><path class="bf-bar bf-b0" d="M-29 30L-29 -2.0A5.0 5.0 0 0 1 -19 -2.0L-19 30Z"/><path class="bf-bar bf-b1" d="M-15 30L-15 -24.0A5.0 5.0 0 0 1 -5 -24.0L-5 30Z"/><path class="bf-bar bf-b2" d="M-1 30L-1 -46.0A5.0 5.0 0 0 1 9 -46.0L9 30Z"/><path class="bf-bar bf-b3" d="M13 30L13 -28.0A5.0 5.0 0 0 1 23 -28.0L23 30Z"/><path class="bf-bar bf-b4" d="M27 30L27 -10.0A5.0 5.0 0 0 1 37 -10.0L37 30Z"/></g>
        <g fill="#fef3c7" filter="url(#bf-edge)"><circle class="bf-spark bf-s0" cx="-18" cy="24" r="1.3"/><circle class="bf-spark bf-s1" cx="-6" cy="24" r="1.0"/><circle class="bf-spark bf-s2" cx="4" cy="24" r="1.5"/><circle class="bf-spark bf-s3" cx="16" cy="24" r="1.1"/><circle class="bf-spark bf-s4" cx="26" cy="24" r="1.3"/><circle class="bf-spark bf-s5" cx="-26" cy="24" r="1.0"/><circle class="bf-spark bf-s6" cx="9" cy="24" r="0.9"/><circle class="bf-spark bf-s7" cx="32" cy="24" r="1.0"/><circle class="bf-spark bf-s8" cx="-10" cy="24" r="1.2"/></g>
        <path d="M-55 29C-48 27.4 -41 27 -34 27L42 27L42 34L34 35C22 36 16 38 15 44L15 48L26 52L28 66L-26 66L-24 52L-13 48L-13 44C-14 38 -22 36 -30 35C-40 34 -48 32 -55 29Z" fill="url(#bf-iron)"/>
        <path class="bf-hot" d="M-30 27L38 27" stroke="#fb923c" stroke-width="3" filter="url(#bf-soft)"/>
        <path d="M-34 27.6L42 27.6" stroke="#fdba74" stroke-width="1.2" stroke-opacity="0.9"/>
      </g>
      <circle r="66.5" fill="none" stroke="url(#bf-ring)" stroke-width="7"/>
      <g stroke="#0c0a09" stroke-opacity="0.55" stroke-width="1.1"><path d="M-45 45L-49.1 49.1"/><path d="M-61.3 25.4L-64.1 26.6"/><path d="M-66.4 0L-69.4 0"/><path d="M-58.8 -24.3L-64.1 -26.6"/><path d="M-47 -47L-49.1 -49.1"/><path d="M-25.4 -61.3L-26.6 -64.1"/><path d="M-0 -63.6L-0 -69.4"/><path d="M25.4 -61.3L26.6 -64.1"/><path d="M47 -47L49.1 -49.1"/><path d="M58.8 -24.3L64.1 -26.6"/><path d="M66.4 -0L69.4 -0"/><path d="M61.3 25.4L64.1 26.6"/><path d="M45 45L49.1 49.1"/></g>
      <circle r="63.0" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="1"/></g>
</svg>
